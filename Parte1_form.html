<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>INF 310 - Contato</title>
    </head>
    
    <body>
        <h1>Formulário para contato:</h1>
        <form id="form_contato" method="post" action="/contato">
            <label for="name">Nome:</label><br>
            <input id="name" type="text" placeholder="Digite seu nome..."><br>
            <label for="email">E-mail:</label><br>
            <input id="email" type="email" placeholder="exemplo@email.com"><br>
            <label for="content">Mensagem:</label><br>
            <textarea id="content" placeholder="Digite sua mensagem, dúvida, sugestão..."></textarea><br>
            <button>⌯⌲ Enviar</button>
        </form>

    </body>


</html>
